name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - setup-ruflo-codex
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Python package
        run: python -m pip install -e '.[dev]'

      - name: Verify repository
        run: npm run verify

  web3-baseline:
    name: Web3 reproducibility guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Web3 lockfile baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f web3-starter/package-lock.json ]; then
            echo "::error title=Web3 dependency baseline is not reproducible::web3-starter/package-lock.json is missing. Do not treat Web3 as production-ready until dependencies are locked and compile/tests run in CI."
            exit 1
          fi
