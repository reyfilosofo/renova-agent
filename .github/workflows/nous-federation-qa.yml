name: NOUS Federation QA

on:
  pull_request:
    paths:
      - '04_NOUS/integrations/**'
      - '.github/workflows/nous-federation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safe-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate federation registries and fictional handoff
        run: python3 04_NOUS/integrations/verify_bridge.py
