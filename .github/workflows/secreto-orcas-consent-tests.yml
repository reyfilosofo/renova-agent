name: Secreto de Orcas - Consentimiento
on:
  pull_request:
    paths:
      - 'integrations/secreto-orcas-consent-netlify/**'
      - '.github/workflows/secreto-orcas-consent-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/secreto-orcas-consent-netlify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
