name: SERESARTE Agent Public Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"
  push:
    branches: [main]
    paths:
      - "content/seresarte_agent_profile.json"
      - "content/seresarte_institutional_post_series.md"
      - "scripts/generate_seresarte_external_feed.py"
      - ".github/workflows/seresarte-external-feed.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seresarte-agent-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Generate multilingual public feed
        run: >-
          python scripts/generate_seresarte_external_feed.py
          --source content/seresarte_institutional_post_series.md
          --output-dir _site/seresarte-agent
          --base-url https://reyfilosofo.github.io/renova-agent/seresarte-agent/
      - name: Add publication root
        shell: bash
        run: |
          cp _site/seresarte-agent/index.html _site/index.html
          touch _site/.nojekyll
      - name: Detect GitHub Pages configuration
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          case "${status}" in
            200)
              echo "deploy=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "deploy=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              cat /tmp/pages.json
              echo "Unexpected GitHub Pages API response: HTTP ${status}" >&2
              exit 1
              ;;
          esac
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.deploy == 'true'
        with:
          path: _site
      - name: Report required one-time Pages setup
        if: steps.pages.outputs.deploy != 'true'
        shell: bash
        run: |
          echo "::warning title=GitHub Pages is disabled::Enable Pages with GitHub Actions as the source, then rerun this workflow."
          {
            echo "### SERESARTE feed generated but not deployed"
            echo
            echo "GitHub Pages is not enabled for this repository."
            echo "Enable **Settings → Pages → Build and deployment → GitHub Actions**, then rerun this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy SERESARTE Agent feed
        id: deployment
        uses: actions/deploy-pages@v4
