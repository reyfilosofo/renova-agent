name: SERESARTE Agent Public Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"
  push:
    branches: [main]
    paths:
      - "content/seresarte_agent_profile.json"
      - "content/seresarte_institutional_post_series.md"
      - "scripts/generate_seresarte_external_feed.py"
      - ".github/workflows/seresarte-external-feed.yml"

permissions:
  contents: read

concurrency:
  group: seresarte-agent-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate multilingual public feed
        run: >-
          python scripts/generate_seresarte_external_feed.py
          --source content/seresarte_institutional_post_series.md
          --output-dir _site/seresarte-agent
          --base-url https://reyfilosofo.github.io/renova-agent/seresarte-agent/

      - name: Add publication root
        shell: bash
        run: |
          cp _site/seresarte-agent/index.html _site/index.html
          touch _site/.nojekyll

      - name: Validate generated feed
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/seresarte-agent/index.html
          test -f _site/.nojekyll
          echo "SERESARTE feed generated successfully. GitHub Pages deployment is centralized in .github/workflows/pages.yml."
