name: MONEY Ω Single-Site Integrity
on:
  push:
    paths:
      - 'money-bridge/site-unification/**'
      - 'money-bridge/MONEY_OMEGA_SINGLE_SITE_MANIFEST.json'
      - '.github/workflows/money-single-site-tests.yml'
  pull_request:
    paths:
      - 'money-bridge/site-unification/**'
      - 'money-bridge/MONEY_OMEGA_SINGLE_SITE_MANIFEST.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test money-bridge/site-unification/*.test.mjs
