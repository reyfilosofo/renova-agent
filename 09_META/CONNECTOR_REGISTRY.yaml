version: 2
orchestrator: "ChatGPT / CENTRO"
repository_visibility: public

connectors:
  google_drive:
    role: document_system_of_record
    authority:
      - masters
      - binary_assets
      - private_documents
      - final_deliverables
      - private_project_manifests
    data_classes_allowed: [P0, P1, P2]
    write_policy: explicit_task_or_verified_workflow
    raw_private_data_allowed: true
    mirror_to_public_github: false

  github:
    repository: reyfilosofo/renova-agent
    role: version_control_and_operational_memory
    authority:
      - code
      - markdown
      - prompts
      - architecture
      - decision_logs
      - public_safe_project_manifests
      - non_sensitive_automation
    data_classes_allowed: [P0, P1_anonymized]
    write_policy: small_verifiable_reversible_commits
    raw_private_data_allowed: false
    secrets_allowed: false

  peach_whatsapp_business:
    role: transactional_messaging_channel
    authority:
      - conversation_lookup
      - contact_lookup
      - contextual_reply
    data_classes_allowed: [P1, P2_transient]
    write_policy: send_only_when_user_or_governed_workflow_authorizes
    raw_export_to_github: false
    otp_handling: never_store_or_forward
    system_sender_autoreply: disabled_by_policy

manifest_system:
  private_drive_root: "SERESARTE_BRAIN — AI OPS 2026/09_META/PROJECT_MANIFESTS_PRIVATE"
  private_index: "CENTRO — Project Manifest Index · Private · 2026-09-08"
  public_index: "09_META/PROJECT_MANIFEST_INDEX.yaml"
  public_project_manifests:
    SERESARTE: "01_SERESARTE/MANIFEST.md"
    RENOVA: "02_RENOVA/MANIFEST.md"
    DAO: "03_DAO/MANIFEST.md"
    NOUS: "04_NOUS/MANIFEST.md"
    ORCAS: "06_LIBROS/ORCAS_MANIFEST.md"
  update_rule: "private manifest may contain Drive references; public manifest must minimize/omit PII, private IDs, contracts, conversations and secrets"

promotion_states:
  - DISCOVERED
  - CANDIDATE
  - VERIFIED_SOURCE
  - MASTER_CANDIDATE
  - MASTER
  - COMMERCIAL_ACTIVE
  - SUPERSEDED

policies:
  source_selection:
    files_and_masters: google_drive
    code_and_rules: github
    whatsapp_conversations: peach_whatsapp_business
    project_status_private: google_drive
    project_status_public_safe: github
  minimization: true
  verify_after_write: true
  decision_log_for_structural_changes: true
  bidirectional_bulk_sync: false
  event_driven_selective_sync: preferred
  pii_to_public_repo: forbidden
  credentials_to_repo_or_chat: forbidden
  master_by_filename_only: forbidden
  commercial_active_implies_editorial_master: false

workflow_contract:
  phases:
    - discover
    - classify
    - read_minimum
    - reason
    - act
    - verify
    - record

project_ready_for_automation_when:
  - stable_project_id
  - verified_document_source
  - explicit_master_or_operational_source
  - version_and_status
  - delivery_rules_when_applicable
  - blockers_explicit
  - rollback_defined
